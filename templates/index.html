{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
  <section class="hero">
    <h1>Share what you're building.</h1>
    <p>Make a profile, tell people what you code in, and keep it up to date.</p>

    {% if session.get('user_id') %}
      <a class="button" href="{{ url_for('profile') }}">Go to your profile</a>
    {% else %}
      <a class="button" href="{{ url_for('register') }}">Create an account</a>
    {% endif %}
  </section>
{% endblock %}
